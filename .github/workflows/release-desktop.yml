name: Release Windows Desktop

on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: 发布所用 tag（不存在时以本次运行提交创建）
        required: false
        type: string

permissions:
  contents: write

concurrency:
  group: release-desktop
  cancel-in-progress: false

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 45
    env:
      TAG: ${{ inputs.tag || github.ref_name }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 12.6.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: src-tauri
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tauri build
      - name: Package portable build
        shell: pwsh
        run: Compress-Archive -Path src-tauri/target/release/zhiyu.exe -DestinationPath zhiyu-win-portable.zip
      - name: Publish GitHub Release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          setup=$(ls src-tauri/target/release/bundle/nsis/*-setup.exe | head -n 1)
          cp "$setup" zhiyu-win-setup.exe
          if gh release view "$TAG" >/dev/null 2>&1; then
            for a in $(gh release view "$TAG" --json assets --jq '.assets[].name'); do
              case "$a" in zhiyu-win-setup.exe|zhiyu-win-portable.zip) ;; *) gh release delete-asset "$TAG" "$a" -y ;; esac
            done
            gh release upload "$TAG" zhiyu-win-setup.exe zhiyu-win-portable.zip --clobber
          else
            gh release create "$TAG" --latest --generate-notes --title "Zhiyu $TAG" zhiyu-win-setup.exe zhiyu-win-portable.zip
          fi
